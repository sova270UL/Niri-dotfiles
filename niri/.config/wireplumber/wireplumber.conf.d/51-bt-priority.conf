# Bluetooth-выход приоритетнее USB-устройств.
# Значения priority.session: BT по умолчанию 1010, USB-гарнитура MCHOSE X9 — 1109.

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
]
